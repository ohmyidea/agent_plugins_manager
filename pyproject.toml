[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plugins-manager"
version = "0.1.0"
description = "Import and normalize research marketplace plugins"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
plugins-manager = "plugins_manager.cli:main"

[tool.setuptools]
packages = ["plugins_manager", "plugins_manager.utils"]
include-package-data = false

[tool.setuptools.package-data]
plugins_manager = ["defaults/gitignore.txt"]
