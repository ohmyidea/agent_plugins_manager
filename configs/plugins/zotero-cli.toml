[plugins.zotero-cli]
repo = "https://github.com/Agents365-ai/zotero-cli-ai.git"
tag = "v0.14.2"

[plugins.zotero-cli.rules]
icon = "config:../icons/zotero-cli.png"
layout = "selective"
required = ["skills/zotero-cli/SKILL.md"]
operations = [
    { action = "copy", from = "skill", to = "skills" },
    { action = "copy", from = "README_CN.md", to = "README.md" },
]

[plugins.zotero-cli.metadata]
version = "0.14.2"
description = "Zotero command-line interface"
author = { name = "Agents365-ai", url = "https://github.com/Agents365-ai" }
homepage = "https://github.com/Agents365-ai/zotero-cli-ai"
repository = "https://github.com/Agents365-ai/zotero-cli-ai"
license = "AGPL-3.0"
keywords = ["academic", "research", "zotero", "cli"]

[plugins.zotero-cli.metadata.claude]
displayName = "Zotero CLI"

[plugins.zotero-cli.metadata.codex]
manifest.interface.displayName = "Zotero CLI"
manifest.interface.shortDescription = "Zotero command-line interface"
manifest.interface.longDescription = "Zotero command-line interface"
manifest.interface.websiteURL = "https://github.com/Agents365-ai/zotero-cli-ai"

[plugins.zotero-cli.metadata.copilot]
marketplace.category = "Research"
marketplace.tags = ["research"]
