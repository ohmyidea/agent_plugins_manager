[plugins.academic-research-skills]
repo = "https://github.com/Imbad0202/academic-research-skills.git"
tag = "v3.24.3"

[plugins.academic-research-skills.rules]
icon = "config:../icons/academic-research-skills.png"
layout = "selective"
required = [
    "skills/academic-paper-reviewer/SKILL.md",
    "skills/academic-paper/SKILL.md",
    "skills/academic-pipeline/SKILL.md",
    "skills/deep-research/SKILL.md",
    "skills/sr-screener/SKILL.md",
    "README.md",
]
operations = [
    # One project README; keep operational registries and dependencies separately.
    { action = "copy", from = "README.zh-CN.md", to = "README.md" },
    { action = "copy", from = "MODE_REGISTRY.md", to = "MODE_REGISTRY.md", optional = true },
    { action = "copy", from = "requirements-pdf-content-classifier.txt", to = "requirements-pdf-content-classifier.txt", optional = true },
    { action = "copy", from = "agents", to = "agents", optional = true },
    { action = "copy", from = "commands", to = "commands", optional = true },
    { action = "copy", from = "hooks", to = "hooks", optional = true },
    { action = "copy", from = "scripts", to = "scripts", optional = true },
    { action = "copy", from = "shared", to = "shared", optional = true },
    # Runtime prompts refer to these examples, protocols and calibration inputs.
    { action = "copy", from = "docs", to = "docs", optional = true },
    { action = "copy", from = "examples", to = "examples", optional = true },
    { action = "copy", from = "evals/gold", to = "evals/gold", optional = true },
    { action = "copy", from = "evals/calibration", to = "evals/calibration", optional = true },
    # Keep each complete skill at its standard plugin path.
    { action = "copy", from = "academic-paper", to = "skills/academic-paper" },
    { action = "copy", from = "academic-paper-reviewer", to = "skills/academic-paper-reviewer" },
    { action = "copy", from = "academic-pipeline", to = "skills/academic-pipeline" },
    { action = "copy", from = "deep-research", to = "skills/deep-research" },
    { action = "copy", from = "sr-screener", to = "skills/sr-screener" },
    # Prune only after copying every runtime tree, including all five skills.
    { action = "remove", paths = [
        "**/tests",
        "**/test_*.py",
        "**/__pycache__",
        "**/.pytest_cache",
        "**/*.pyc",
        "scripts/fixtures",
        "scripts/_ci_pytest_manifest.toml",
        "scripts/run_ci_pytest_manifest.py",
        "scripts/check_*.py",
        "scripts/build_*.py",
        "scripts/sync_adapter_docs.py",
        "docs/changelog-archive",
        "docs/ROADMAP*.md",
        # Unreferenced v3.24.3 documents; referenced runtime specifications stay.
        "docs/cross-paper-workflow.md",
        "docs/design",
        "docs/migration",
        "examples/showcase",
        "examples/pi",
        "skills/*/references/changelog.md",
    ] },
    # README links keep pointing to the original repository after repackaging.
    { action = "replace_regex", paths = ["README.md"], old = '(?<!\!)\[([^\]\r\n]+)\]\((?!https?://|#)([^)\s]+)\)', new = '[\1](https://github.com/Imbad0202/academic-research-skills/blob/v3.24.3/\2)' },
]

[plugins.academic-research-skills.metadata]
version = "3.24.3"
description = "Production-grade academic research pipeline: research → write → review → revise → finalize."
author = { name = "Cheng-I Wu" }
homepage = "https://github.com/Imbad0202/academic-research-skills"
repository = "https://github.com/Imbad0202/academic-research-skills"
license = "CC-BY-NC-4.0"
keywords = [
    "academic",
    "research",
    "writing",
    "review",
    "deep-research",
    "literature-review",
    "systematic-review",
    "peer-review",
    "scholarly-publishing",
]

[plugins.academic-research-skills.metadata.claude]
displayName = "Academic Research Skills"

[plugins.academic-research-skills.metadata.codex]
marketplace.enabled = false
manifest.interface.displayName = "Academic Research Skills"
manifest.interface.shortDescription = "Academic research workflows"
manifest.interface.websiteURL = "https://github.com/Imbad0202/academic-research-skills"

[plugins.academic-research-skills.metadata.copilot]
marketplace.category = "Research"
marketplace.tags = ["research"]
