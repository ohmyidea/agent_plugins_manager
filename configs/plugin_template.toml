# 复制到 configs/plugins/<插件名>.toml，将所有 example-plugin 改为同一个插件名。
# 将示例图标和组件路径替换为实际存在的文件。
# metadata 只放跨平台共用字段；metadata.<platform> 只放该平台的共用字段。
# marketplace 写市场专属字段，manifest 写插件清单专属字段，两者各自覆盖公共默认值。
#
# [构建] 仅由 plugins_manager 使用。
# [市场] 写入对应平台的 marketplace.json。
# [插件] 写入对应平台的 plugin.json。

# [构建] 上游仓库与引用。
[plugins.example-plugin]
repo = "https://github.com/OWNER/REPO.git"
# ref = "HEAD"                         # 可填分支、refs/tags/v1.2.0 或完整提交 SHA

# [构建] 打包布局、资源与文件操作。
[plugins.example-plugin.rules]
source_dir = "." # 相对于上游仓库根目录
layout = "full" # full 复制源码目录；selective 从空目录开始
gitignore = "template" # template、keep、merge
icon = "config:../icons/example.png" # 复制到 Claude/Codex 的插件根目录，提供默认图标
required = ["skills/example/SKILL.md"]
operations = [
    { action = "copy", from = "skill/example", to = "skills/example" },
    { action = "remove", paths = [
        "scripts/tests",
        "scripts/test_*.py",
    ] },
]
# operations 也支持 move、mkdir、replace 和 replace_regex。

# [共同] 三个平台共享的公共值。
[plugins.example-plugin.metadata]
version = "1.2.0"
description = "A short description of the plugin."
author = { name = "Example Team", email = "plugins@example.org", url = "https://example.org/team" }
homepage = "https://example.org/plugin"
repository = "https://github.com/OWNER/REPO"
license = "MIT"
keywords = ["research", "writing"]

# [共同] Claude Code 的公共值。
[plugins.example-plugin.metadata.claude]
displayName = "Example Plugin"
defaultEnabled = true
dependencies = []
metadata = { team = "Example Team" }
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# version = "1.2.0"
# description = "Research and writing workflows for Claude Code."
# author = { name = "Example Team", email = "plugins@example.org", url = "https://example.org/team" }
# homepage = "https://example.org/plugin"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["research", "writing"]

# [市场] Claude → <marketplace>/.claude-plugin/marketplace.json
[plugins.example-plugin.metadata.claude.marketplace]
enabled = true                                                               # [构建] false 仍生成插件清单
category = "Research"
tags = ["research"]
relevance = { topic = "References", signals = { filesRead = ["**/*.bib"] } }
strict = true
# name、source 自动生成，version 取该平台最终的 plugin.json。
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# displayName = "Example Plugin for Claude"
# description = "Description shown in the Claude catalog."
# author = { name = "Example Catalog Team" }
# homepage = "https://example.org/catalog"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["literature"]
# defaultEnabled = true
# dependencies = []
# metadata = { team = "Example Team" }

# [插件] Claude → <marketplace>/plugins/example-plugin/.claude-plugin/plugin.json
[plugins.example-plugin.metadata.claude.manifest]
root = "."                                                                                                                       # [构建] 插件根目录
mode = "template"                                                                                                                # [构建] 清单处理模式
"$schema" = "https://json.schemastore.org/claude-code-plugin-manifest.json"
icon = "./assets/icon.png"
documentationUrl = "https://example.org/docs"
supportUrl = "https://example.org/support"
privacyPolicyUrl = "https://example.org/privacy"
termsOfServiceUrl = "https://example.org/terms"
settings = {}
userConfig = { language = { type = "string", title = "Language", description = "Preferred response language", default = "en" } }
types = "./types/plugin.d.ts"
channels = []
skills = "./skills/"
commands = "./commands/"
agents = ["./agents/reviewer.md"]
hooks = "./hooks/hooks.json"
mcpServers = "./.mcp.json"
lspServers = "./.lsp.json"
outputStyles = "./output-styles/"
workflows = "./workflows/"
experimental = { evals = "./evals/" }
themes = "./themes/"                                                                                                             # 顶层旧写法。也可改用 experimental.themes
monitors = []                                                                                                                    # 顶层旧写法。也可改用 experimental.monitors
# name 从插件表名生成。
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# version = "1.2.0-claude"
# description = "Description written to the Claude plugin manifest."
# author = { name = "Example Plugin Team" }
# homepage = "https://example.org/plugin"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["research"]
# displayName = "Example Plugin for Claude"
# defaultEnabled = true
# dependencies = []
# metadata = { team = "Example Team" }

# [共同] Codex 的公共值。
[plugins.example-plugin.metadata.codex]
category = "Productivity"

# [市场] Codex → <marketplace>/.agents/plugins/marketplace.json
[plugins.example-plugin.metadata.codex.marketplace]
enabled = true                                                         # [构建] false 仍生成插件清单
policy = { installation = "AVAILABLE", authentication = "ON_INSTALL" }
# installation 可选 AVAILABLE、INSTALLED_BY_DEFAULT、NOT_AVAILABLE。
# authentication 可选 ON_INSTALL、ON_USE。
# name 和对象形式的 source 自动生成。
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# category = "Productivity"

# [插件] Codex → <marketplace>/plugins/example-plugin/.codex-plugin/plugin.json
[plugins.example-plugin.metadata.codex.manifest]
root = "."                         # [构建] 插件根目录
mode = "template"                  # [构建] 清单处理模式
id = "example-plugin"
skills = "./skills/"
mcpServers = "./mcp.json"          # 本例与 Copilot 共用根目录
apps = "./.app.json"
hooks = "./hooks/hooks.json"
extensions = { "com.openai" = {} }

# 点号字段写入插件清单的 interface 对象。
interface.displayName = "Example Plugin"
interface.shortDescription = "Research and writing tools"
interface.longDescription = "Organize references and review research drafts."
interface.developerName = "Example Team"
interface.capabilities = ["Interactive"]
interface.websiteURL = "https://example.org/plugin"
interface.supportURL = "https://example.org/support"
interface.privacyPolicyURL = "https://example.org/privacy"
interface.termsOfServiceURL = "https://example.org/terms"
interface.defaultPrompt = ["Review these references"]
interface.brandColor = "#315A7D"
interface.brandColorDark = "#8DB9E0"
interface.composerIcon = "./assets/icon.png"
interface.composerIconDark = "./assets/icon-dark.png"
interface.logo = "./assets/icon.png"
interface.logoDark = "./assets/icon-dark.png"
interface.screenshots = ["./assets/screenshot.png"]
# name 从插件表名生成。
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# interface.category = "Productivity"
# version = "1.2.0-codex"
# description = "Description written to the Codex plugin manifest."
# author = { name = "Example Plugin Team" }
# homepage = "https://example.org/plugin"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["research"]

# [构建] --combined 模式中 Codex 和 Copilot 共用目录时，从根 plugin.json 读取核心字段。
# 需要不同版本、包描述或组件布局时，设置不同的 root。

# [共同] GitHub Copilot CLI 的公共值。
[plugins.example-plugin.metadata.copilot]
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# version = "1.2.0"
# description = "A short description of the plugin."
# author = { name = "Example Team", email = "plugins@example.org", url = "https://example.org/team" }
# homepage = "https://example.org/plugin"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["research", "writing"]

# [市场] Copilot → <marketplace>/.github/plugin/marketplace.json
[plugins.example-plugin.metadata.copilot.marketplace]
enabled = true        # [构建] false 仍生成插件清单
category = "Research"
tags = ["research"]
strict = true
# name、source 自动生成，version 取该平台最终的 plugin.json。
######## [以下字段继承公共值，取消注释可覆盖公共值] ######## 
# description = "Description shown in the Copilot catalog."
# author = { name = "Example Catalog Team" }
# homepage = "https://example.org/catalog"
# repository = "https://github.com/OWNER/REPO"
# license = "MIT"
# keywords = ["literature"]

# [插件] Copilot → <marketplace>/plugins/example-plugin/plugin.json
[plugins.example-plugin.metadata.copilot.manifest]
root = "."                                 # [构建] 插件根目录
mode = "template"                          # [构建] 清单处理模式
schema = "1.0.0"                           # [构建] 也可选 "1.1.0"，生成 "$schema"
extensions = { "com.github.copilot" = {} }
# name 从插件表名生成。
# Agent Plugins 从 skills/、mcp.json 和 Copilot 专属目录发现组件。
# 核心字段与 Codex 不同时，为两个平台设置不同的 root。
